        {type:"qcm", q:"[Pharmacodynamie] Le passage d'une molécule à travers une membrane cellulaire dépend de la taille de la molécule :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["a"], explain:"Plus une molécule est petite, plus elle traverse facilement les membranes."},
        {type:"qcm", q:"[Pharmacodynamie] Un médicament AGONISTE est une substance qui :", options:[{k:"a",t:"Se fixe sur un récepteur et le bloque"},{k:"b",t:"Se fixe sur le récepteur et l'active"},{k:"c",t:"Détruit un récepteur"}], correct:["b"], explain:"L'agoniste active le récepteur (comme la substance naturelle)."},
        {type:"qcm", q:"[Pharmacodynamie] Un médicament AGONISTE TOTAL :", options:[{k:"a",t:"Se fixe sur le récepteur et le stimule"},{k:"b",t:"Se fixe sur le récepteur et le bloque"},{k:"c",t:"Reproduit ce que fait la substance endogène et provoque la même réaction physiologique"}], correct:["a","c"], explain:"L'agoniste total mime totalement la substance endogène."},
        {type:"qcm", q:"[Pharmacodynamie] Un médicament ANTAGONISTE est une substance qui :", options:[{k:"a",t:"Se fixe sur un récepteur et le bloque"},{k:"b",t:"Se fixe sur le récepteur et l'active"},{k:"c",t:"Ne déclenche pas de réaction cellulaire après s'être fixé sur le récepteur"}], correct:["a","c"], explain:"L'antagoniste occupe le récepteur sans l'activer : il le bloque."},
        {type:"qcm", q:"[Pharmacodynamie] Un médicament peut engendrer 1 ou plusieurs effets thérapeutiques en fonction de la dose administrée :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["a"], explain:"Selon la dose, un même médicament peut avoir des effets différents."},
        {type:"qcm", q:"[Pharmacodynamie] La spécificité d'un médicament correspond à :", options:[{k:"a",t:"Sa capacité à se fixer sur 1 seul type de récepteur"},{k:"b",t:"Sa capacité à se fixer sur plusieurs types de récepteurs"},{k:"c",t:"Sa capacité à occuper tous les récepteurs"}], correct:["a"], explain:"Plus un médicament est spécifique, moins il a d'effets sur d'autres récepteurs (moins d'effets indésirables)."},
        {type:"qcm", q:"[Pharmacodynamie] La liaison Médicament-Récepteur est une liaison :", options:[{k:"a",t:"Irréversible"},{k:"b",t:"Réversible"},{k:"c",t:"Saturable"}], correct:["b","c"], explain:"La liaison est généralement réversible et saturable (nombre limité de récepteurs)."},
        {type:"qcm", q:"[Pharmacodynamie] La diffusion SIMPLE à travers une membrane :", options:[{k:"a",t:"Nécessite toujours un transporteur membranaire"},{k:"b",t:"Est un mécanisme de transport passif"},{k:"c",t:"Est un mécanisme de transport actif (avec dépense d'énergie)"}], correct:["b"], explain:"La diffusion simple est passive (sans énergie, dans le sens du gradient)."},
        {type:"qcm", q:"[Pharmacodynamie] La diffusion d'un médicament de part et d'autre d'une membrane se fait dans le sens :", options:[{k:"a",t:"Du milieu le moins concentré vers le plus concentré"},{k:"b",t:"Du milieu le plus concentré vers le moins concentré"}], correct:["b"], explain:"Diffusion passive : du plus concentré vers le moins concentré."},
        {type:"qcm", q:"[Pharmacodynamie] L'occupation totale des sites des récepteurs se nomme :", options:[{k:"a",t:"L'affinité des récepteurs"},{k:"b",t:"La saturation des récepteurs"}], correct:["b"], explain:"Quand tous les récepteurs sont occupés, on parle de saturation."},
        {type:"qcm", q:"[Pharmacodynamie] La capacité d'un médicament à se lier à un récepteur se nomme l'affinité :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["a"], explain:"L'affinité = capacité du médicament à se lier à son récepteur."},
        {type:"qcm", q:"[Pharmacodynamie] Toute substance qui se lie à un récepteur s'appelle un ligand :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["a"], explain:"Un ligand est toute molécule qui se fixe sur un récepteur."},
        {type:"qcm", q:"[Pharmacodynamie] Un ligand peut être agoniste ou antagoniste :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["a"], explain:"Un ligand active (agoniste) ou bloque (antagoniste) le récepteur."},
        {type:"qcm", q:"[Pharmacodynamie] En thérapeutique, on peut associer un agoniste et un antagoniste :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["b"], explain:"Les associer serait contre-productif : l'antagoniste bloquerait l'effet de l'agoniste."},
        {type:"qcm", q:"[Pharmacodynamie] Un antidote agit contre une intoxication médicamenteuse en se fixant sur les récepteurs et en les :", options:[{k:"a",t:"Stimulant"},{k:"b",t:"Bloquant"}], correct:["b"], explain:"L'antidote bloque les récepteurs pour contrer l'effet du toxique (souvent un antagoniste)."},
        {type:"qcm", q:"[Pharmacodynamie] Tous les médicaments mis sur le marché ont un antidote :", options:[{k:"a",t:"Vrai"},{k:"b",t:"Faux"}], correct:["b"], explain:"Seuls certains médicaments disposent d'un antidote spécifique."}
      ]
    }
  ]
};

</script>

/* ============ État & stockage ============ */
const LS_STATS = "qcm_bloc3_stats_v1";
const LS_SESS  = "qcm_bloc3_sessions_v1";
const EXAM_SECONDS = 30;
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
let stats = loadJSON(LS_STATS,{});
let sessions = loadJSON(LS_SESS,[]);

const app = document.getElementById('app');
const homeBtn = document.getElementById('homeBtn');
const subtitle = document.getElementById('subtitle');

let session = null;   // {list, pos, answers, scope, mode, tStart}
let timer = {id:null, remaining:0, qStart:0};

/* ============ Utilitaires ============ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nl2br(s){return s.replace(/\n/g,'<br>')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
function totalQuestions(){return QCM_DATA.themes.reduce((n,t)=>n+t.questions.length,0)}
function themeById(id){return QCM_DATA.themes.find(t=>t.id===id)}
function qStat(tid,idx){return (stats[tid]||{})[idx]||null}
function errorPool(){
  let p=[];
  QCM_DATA.themes.forEach(t=>t.questions.forEach((q,i)=>{
    const s=qStat(t.id,i); if(s&&s.seen&&s.lastCorrect===false)p.push({tid:t.id,idx:i,q});
  }));
  return p;
}
function masteredCount(){
  let m=0; QCM_DATA.themes.forEach(t=>t.questions.forEach((q,i)=>{const s=qStat(t.id,i);if(s&&s.seen&&s.lastCorrect)m++;}));
  return m;
}
function recordAnswer(tid,idx,isCorrect){
  if(!stats[tid])stats[tid]={};
  const cur=stats[tid][idx]||{seen:0,correct:0};
  cur.seen=(cur.seen||0)+1;
  if(isCorrect)cur.correct=(cur.correct||0)+1;
  cur.lastCorrect=isCorrect;
  stats[tid][idx]=cur; saveJSON(LS_STATS,stats);
}
function themeStats(tid){
  const t=themeById(tid); let seen=0,correct=0;
  Object.values(stats[tid]||{}).forEach(o=>{if(o.seen){seen++;if(o.lastCorrect)correct++}});
  return {answered:seen,correct,total:t.questions.length};
}

/* ============ Accueil ============ */
function goHome(){
  stopTimer(); session=null;
  homeBtn.classList.remove('show');
  subtitle.textContent="Délégué Pharmaceutique · Bloc 3";
  window.scrollTo(0,0);
  const errN=errorPool().length;
  const g = QCM_DATA.themes.map(t=>{
    const st=themeStats(t.id);
    const pct=st.total?Math.round(st.answered/st.total*100):0;
    return `<button class="theme" onclick="openConfig('${t.id}')">
      <div class="ico">${t.icon}</div><div class="nm">${t.name}</div>
      <div class="ct">${t.questions.length} questions${st.answered?` · ${Math.round(st.correct/Math.max(st.answered,1)*100)}%`:''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></button>`;
  }).join('');
  app.innerHTML = `
    <div class="big-actions">
      <div class="card-action primary" onclick="openConfig('ALL')">
        <div class="ico">&#127775;</div><div><b>Toutes les questions</b><span>Les ${totalQuestions()} questions mélangées</span></div>
      </div>
      <div class="card-action warn ${errN?'':'disabled'}" onclick="${errN?"openConfig('ERRORS')":"toast('Aucune erreur à revoir pour l\\'instant')"}">
        <div class="ico">&#128260;</div><div><b>Mes erreurs</b><span>Rejouer mes questions ratées</span></div>${errN?`<div class="badge">${errN}</div>`:''}
      </div>
      <div class="card-action" onclick="showAnalyse()">
        <div class="ico">&#128202;</div><div><b>Mon analyse</b><span>Progrès & statistiques</span></div>
      </div>
    </div>
    <h2 class="section">Choisir un thème</h2>
    <div class="grid">${g}</div>
    <p class="hint" style="text-align:center;margin-top:22px">
      ${QCM_DATA.themes.length} thèmes &middot; ${totalQuestions()} questions au total<br>
      Ordre aléatoire à chaque session &middot; Progression enregistrée sur cet appareil</p>`;
}

/* ============ Configuration ============ */
let cfg={scope:'ALL', len:'20', mode:'learn'};
function scopeName(scope){
  if(scope==='ALL')return 'Toutes les questions';
  if(scope==='ERRORS')return 'Mes erreurs';
  return themeById(scope).name;
}
function openConfig(scope){
  stopTimer();
  cfg.scope=scope; cfg.mode='learn';
  homeBtn.classList.add('show');
  let max;
  if(scope==='ALL')max=totalQuestions();
  else if(scope==='ERRORS')max=errorPool().length;
  else max=themeById(scope).questions.length;
  subtitle.textContent=scopeName(scope);
  window.scrollTo(0,0);
  const title = scope==='ALL'?'&#127775; Toutes les questions'
    : scope==='ERRORS'?'&#128260; Mes erreurs'
    : themeById(scope).icon+' '+themeById(scope).name;
  let lens=[10,20,30].filter(n=>n<max); lens.push(max);
  cfg.len=String(Math.min(20,max));
  app.innerHTML=`
    <div class="panel">
      <h3>${title}</h3>
      <div class="desc">${scope==='ERRORS'?`${max} question(s) à revoir. `:''}Session en ordre aléatoire.</div>
      <div class="flabel">Mode</div>
      <div class="moderow" id="moderow">
        <div class="modecard on" data-mode="learn" onclick="pickMode('learn')">
          <div class="mt">&#128218; Apprentissage</div><div class="md">Correction et explication après chaque question. Sans limite de temps.</div>
        </div>
        <div class="modecard" data-mode="exam" onclick="pickMode('exam')">
          <div class="mt">&#9201;&#65039; Examen chrono</div><div class="md">${EXAM_SECONDS}s par question, minuteur affiché. Correction à la fin.</div>
        </div>
      </div>
      <div class="flabel">Nombre de questions</div>
      <div class="lenrow" id="lenrow">
        ${lens.map(n=>`<button class="chip ${String(n)===cfg.len?'on':''}" data-len="${n}" onclick="pickLen(${n})">${n===max?'Toutes ('+n+')':n}</button>`).join('')}
      </div>
      <button class="btn primary" onclick="startSession()">Commencer &#9654;</button>
    </div>`;
}
function pickLen(n){cfg.len=String(n);document.querySelectorAll('#lenrow .chip').forEach(c=>c.classList.toggle('on',c.dataset.len===cfg.len))}
function pickMode(m){cfg.mode=m;document.querySelectorAll('#moderow .modecard').forEach(c=>c.classList.toggle('on',c.dataset.mode===m))}

function buildPool(){
  if(cfg.scope==='ALL'){let p=[];QCM_DATA.themes.forEach(t=>t.questions.forEach((q,i)=>p.push({tid:t.id,idx:i,q})));return p;}
  if(cfg.scope==='ERRORS')return errorPool();
  return themeById(cfg.scope).questions.map((q,i)=>({tid:cfg.scope,idx:i,q}));
}
function startSession(){
  const pool=shuffle(buildPool());
  const len=parseInt(cfg.len,10);
  session={list:pool.slice(0,len), pos:0, answers:[], scope:cfg.scope, mode:cfg.mode, tStart:Date.now(), timeSpent:0};
  renderQuestion();
}

/* ============ Minuteur (mode examen) ============ */
function stopTimer(){if(timer.id){clearInterval(timer.id);timer.id=null;}}
function startTimer(){
  stopTimer();
  timer.remaining=EXAM_SECONDS; timer.qStart=Date.now();
  updateTimerUI();
  timer.id=setInterval(()=>{
    timer.remaining--;
    updateTimerUI();
    if(timer.remaining<=0){stopTimer();autoAdvance();}
  },1000);
}
function updateTimerUI(){
  const el=document.getElementById('timer'), bar=document.getElementById('timerbarfill');
  if(!el)return;
  el.textContent='⏱️ '+timer.remaining+'s';
  const r=timer.remaining;
  el.className='timer'+(r<=5?' danger':r<=10?' warn':'');
  if(bar){bar.style.width=(r/EXAM_SECONDS*100)+'%';bar.className=(r<=5?'danger':r<=10?'warn':'');}
}
function autoAdvance(){
  const it=session.list[session.pos], q=it.q;
  if(q.type==='qcm'){
    const sel=[...document.querySelectorAll('#opts .opt.sel')].map(e=>e.dataset.k);
    lockExamQCM(it,sel);
  } else {
    const txt=(document.getElementById('qrocInput')||{}).value||'';
    session.answers.push({item:it,isCorrect:null,userText:txt});
  }
  goNextExam();
}

/* ============ Affichage question ============ */
function renderQuestion(){
  stopTimer();
  window.scrollTo(0,0);
  homeBtn.classList.add('show');
  const {list,pos,mode}=session;
  const it=list[pos], q=it.q, theme=themeById(it.tid);
  const prog=Math.round(pos/list.length*100);
  const exam = mode==='exam';
  let body = q.type==='qcm'
    ? `<div class="opts" id="opts">`+q.options.map(o=>`
        <div class="opt" data-k="${o.k}" onclick="toggleOpt(this)"><div class="box"></div>
        <div class="lbl"><span class="key">${o.k})</span> ${nl2br(esc(o.t))}</div></div>`).join('')+`</div>`
    : `<textarea class="qroc" id="qrocInput" placeholder="Écris ta réponse ici (facultatif)..."></textarea>`;
  const timerHTML = exam
    ? `<div class="timer" id="timer">⏱️ ${EXAM_SECONDS}s</div>`
    : '';
  const timerBar = exam ? `<div class="timerbar"><i id="timerbarfill"></i></div>` : '';
  let footerBtn;
  if(exam){
    footerBtn = q.type==='qcm'
      ? `<button class="btn warnb" onclick="examValidate()">Valider &amp; suivant &#8594;</button>`
      : `<button class="btn warnb" onclick="examSkipQroc()">Suivant &#8594;</button>`;
  } else {
    footerBtn = `<button class="btn primary" id="validateBtn" onclick="validate()">${q.type==='qcm'?'Valider':'Afficher la réponse'}</button>`;
  }
  app.innerHTML=`
    <div class="quiztop">
      <div class="progress"><i style="width:${prog}%"></i></div>
      ${timerHTML}
      <div class="qcount">${pos+1} / ${list.length}</div>
    </div>
    ${timerBar}
    <div class="qtheme">${theme.icon} ${theme.name}<span class="qtype ${q.type}">${q.type==='qcm'?'QCM':'QROC'}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="hint">${exam?(q.type==='qcm'?'Coche ta réponse avant la fin du temps.':'Réponds mentalement, la correction viendra à la fin.'):(q.type==='qcm'?'Coche la ou les réponses, puis valide.':'Réponds puis affiche la correction.')}</div>
    ${body}
    <div id="fbZone"></div>
    <div class="footer-bar" id="footer">${footerBtn}</div>`;
  if(exam)startTimer();
}
function toggleOpt(el){
  if(el.classList.contains('disabled'))return;
  el.classList.toggle('sel');
  el.querySelector('.box').textContent=el.classList.contains('sel')?'✓':'';
}

/* ============ Mode examen : validation ============ */
function isQCMCorrect(q,sel){
  const c=q.correct.slice().sort(), s=sel.slice().sort();
  return c.length===s.length && c.every((v,i)=>v===s[i]);
}
function lockExamQCM(it,sel){
  const ok=isQCMCorrect(it.q,sel);
  recordAnswer(it.tid,it.idx,ok);
  session.answers.push({item:it,isCorrect:ok,chosen:sel});
}
function examValidate(){
  stopTimer();
  const it=session.list[session.pos];
  const sel=[...document.querySelectorAll('#opts .opt.sel')].map(e=>e.dataset.k);
  lockExamQCM(it,sel);
  goNextExam();
}
function examSkipQroc(){
  stopTimer();
  const it=session.list[session.pos];
  const txt=(document.getElementById('qrocInput')||{}).value||'';
  session.answers.push({item:it,isCorrect:null,userText:txt});
  goNextExam();
}
function goNextExam(){
  session.pos++;
  if(session.pos>=session.list.length)finishSession();
  else renderQuestion();
}

/* ============ Mode apprentissage : validation ============ */
function validate(){
  const it=session.list[session.pos], q=it.q;
  if(q.type==='qcm'){
    const sel=[...document.querySelectorAll('#opts .opt.sel')].map(e=>e.dataset.k);
    const ok=isQCMCorrect(q,sel);
    document.querySelectorAll('#opts .opt').forEach(el=>{
      el.classList.add('disabled');
      const k=el.dataset.k, good=q.correct.includes(k), picked=sel.includes(k);
      const box=el.querySelector('.box'); el.classList.remove('sel');
      if(good){el.classList.add('correct');box.textContent='✓';el.insertAdjacentHTML('beforeend','<span class="tag">Bonne réponse</span>');}
      else if(picked){el.classList.add('wrong');box.textContent='✗';el.insertAdjacentHTML('beforeend','<span class="tag">Votre choix</span>');}
    });
    recordAnswer(it.tid,it.idx,ok);
    session.answers.push({item:it,isCorrect:ok});
    const goodTxt=q.correct.map(k=>k.toUpperCase()).join(', ');
    document.getElementById('fbZone').innerHTML=`
      <div class="feedback ${ok?'good':'bad'}">
        <div class="ftitle">${ok?'&#10004; Correct !':'&#10008; Réponse incorrecte'}</div>
        ${ok?'':`<div class="ans">Bonne(s) réponse(s) : <b>${goodTxt}</b></div>`}
        <div class="exp">${esc(q.explain)}</div></div>`;
    document.getElementById('footer').innerHTML=nextBtnHTML();
    document.getElementById('fbZone').scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    document.getElementById('footer').remove();
    document.getElementById('fbZone').innerHTML=`
      <div class="feedback neutral">
        <div class="ftitle">&#128172; Réponse attendue</div>
        <div class="ans"><b>${esc(q.answer)}</b></div>
        <div class="exp">${esc(q.explain)}</div></div>
      <div class="selfassess">
        <button class="btn ok" onclick="qrocSelf(true)">&#10004; Je savais</button>
        <button class="btn ghost" onclick="qrocSelf(false)">&#10008; Je ne savais pas</button>
      </div>`;
  }
}
function qrocSelf(known){
  const it=session.list[session.pos];
  recordAnswer(it.tid,it.idx,known);
  session.answers.push({item:it,isCorrect:known});
  const sa=document.querySelector('.selfassess');
  const html=`<div class="footer-bar">${nextBtnHTML()}</div>`;
  if(sa)sa.outerHTML=html; else app.insertAdjacentHTML('beforeend',html);
  window.scrollTo(0,document.body.scrollHeight);
}
function nextBtnHTML(){
  const last=session.pos>=session.list.length-1;
  return `<button class="btn primary" onclick="nextQuestion()">${last?'Voir mes résultats &#127942;':'Question suivante &#8594;'}</button>`;
}
function nextQuestion(){
  session.pos++;
  if(session.pos>=session.list.length)finishSession();
  else renderQuestion();
}

/* ============ Résultats ============ */
function finishSession(){
  stopTimer();
  session.timeSpent=Math.round((Date.now()-session.tStart)/1000);
  window.scrollTo(0,0);
  renderResults();
  // enregistrer la session (basée sur ce qui est déjà noté)
  const graded=session.answers.filter(a=>a.isCorrect!==null);
  const correct=graded.filter(a=>a.isCorrect).length;
  session._sessionIndex=sessions.length;
  sessions.push({date:Date.now(),scope:session.scope,mode:session.mode,total:graded.length,correct,timeSpent:session.timeSpent});
  saveJSON(LS_SESS,sessions);
}
function renderResults(){
  const ans=session.answers;
  const graded=ans.filter(a=>a.isCorrect!==null);
  const correct=graded.filter(a=>a.isCorrect).length;
  const pct=graded.length?Math.round(correct/graded.length*100):0;
  const pendingQroc=ans.filter(a=>a.isCorrect===null).length;
  const color=pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--ko)';
  const msg=graded.length===0?'Auto-évalue tes QROC ↓':pct>=80?'Excellent ! &#127881;':pct>=50?'Bien, continue ! &#128170;':'À retravailler &#128218;';
  const examExtra = session.mode==='exam'
    ? `<div class="desc" style="margin:6px 0 0">&#9201;&#65039; ${session.timeSpent}s au total · ${Math.round(session.timeSpent/Math.max(ans.length,1))}s/question en moyenne</div>` : '';
  const review=ans.map((a,i)=>renderReviewItem(a,i)).join('');
  app.innerHTML=`
    <div class="panel">
      <div class="scorebox">
        <div class="scorecircle" id="scoreCircle" style="background:${color}">
          <div class="pct" id="scorePct">${graded.length?pct+'%':'—'}</div>
          <div class="frac" id="scoreFrac">${correct} / ${graded.length}${graded.length?'':' noté'}</div>
        </div>
        <h3 style="margin:4px 0" id="scoreMsg">${msg}</h3>
        <div class="desc" style="margin-bottom:0">${scopeName(session.scope)} · ${session.mode==='exam'?'Mode examen':'Mode apprentissage'}</div>
        ${examExtra}
        ${pendingQroc?`<div class="desc" id="pendNote" style="margin-top:6px;color:var(--accent);font-weight:600">${pendingQroc} QROC à auto-évaluer ci-dessous</div>`:''}
      </div>
    </div>
    <div class="footer-bar" style="position:static">
      <div class="big-actions">
        <button class="btn primary" onclick="openConfig('${session.scope}')">&#128260; Rejouer</button>
        <button class="btn ghost" onclick="goHome()">&#127968; Accueil</button>
      </div>
    </div>
    <h2 class="section">Correction détaillée</h2>
    <div class="review">${review}</div>
    <div class="footer-bar" style="position:static"><button class="btn ghost" onclick="showAnalyse()">Voir mon analyse globale &#128202;</button></div>`;
}
function renderReviewItem(a,i){
  const q=a.item.q, th=themeById(a.item.tid);
  const mk=a.isCorrect===null?'&#10067;':a.isCorrect?'&#9989;':'&#10060;';
  let corr='';
  if(q.type==='qcm'){
    const goodTxt=q.correct.map(k=>k.toUpperCase()).join(', ');
    corr=`<div class="rev-corr"><b>Bonne(s) réponse(s) : ${goodTxt}</b> — ${q.options.filter(o=>q.correct.includes(o.k)).map(o=>nl2br(esc(o.t))).join(' ; ')}<br><span style="color:var(--muted)">${esc(q.explain)}</span></div>`;
  } else {
    corr=`<div class="rev-corr"><b>Réponse : ${esc(q.answer)}</b><br><span style="color:var(--muted)">${esc(q.explain)}</span></div>`;
    if(a.isCorrect===null){
      corr+=`<div class="rev-self" id="self-${i}">
        <button onclick="reviewSelf(${i},true)">&#10004; Je savais</button>
        <button onclick="reviewSelf(${i},false)">&#10008; Je ne savais pas</button></div>`;
    }
  }
  return `<div class="rev-item" id="rev-${i}">
    <div class="rev-head"><div class="mk" id="mk-${i}">${mk}</div>
    <div><div>${esc(q.q)}</div><div class="qx">${th.icon} ${th.name} · ${q.type.toUpperCase()}</div></div></div>
    ${corr}</div>`;
}
function reviewSelf(i,known){
  const a=session.answers[i];
  if(a.isCorrect!==null)return;
  a.isCorrect=known;
  recordAnswer(a.item.tid,a.item.idx,known);
  document.getElementById('mk-'+i).innerHTML=known?'&#9989;':'&#10060;';
  const sd=document.getElementById('self-'+i);
  if(sd){sd.querySelectorAll('button').forEach(b=>b.classList.remove('pk-ok','pk-ko'));
    sd.children[known?0:1].classList.add(known?'pk-ok':'pk-ko');}
  // maj score en direct
  const graded=session.answers.filter(x=>x.isCorrect!==null);
  const correct=graded.filter(x=>x.isCorrect).length;
  const pct=graded.length?Math.round(correct/graded.length*100):0;
  const color=pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--ko)';
  document.getElementById('scoreCircle').style.background=color;
  document.getElementById('scorePct').textContent=pct+'%';
  document.getElementById('scoreFrac').textContent=correct+' / '+graded.length;
  const pend=session.answers.filter(x=>x.isCorrect===null).length;
  const pn=document.getElementById('pendNote'); if(pn)pn.textContent=pend?pend+' QROC à auto-évaluer ci-dessous':'Toutes les questions sont évaluées ✔';
  // maj session enregistrée
  if(sessions[session._sessionIndex]){sessions[session._sessionIndex].total=graded.length;sessions[session._sessionIndex].correct=correct;saveJSON(LS_SESS,sessions);}
}

/* ============ Analyse ============ */
function showAnalyse(){
  stopTimer(); session=null;
  window.scrollTo(0,0); homeBtn.classList.add('show');
  subtitle.textContent="Mon analyse";
  if(sessions.length===0){
    app.innerHTML=`<div class="panel"><div class="empty">&#128202;<br><br>Aucune session terminée.<br>Lance un entraînement pour suivre tes progrès ici !</div></div>
      <div class="footer-bar" style="position:static"><button class="btn primary" onclick="goHome()">Commencer &#9654;</button></div>`;
    return;
  }
  let totSeen=0,totCorrect=0;const totQ=totalQuestions();
  const rows=QCM_DATA.themes.map(t=>{
    let seen=0,correct=0;
    Object.values(stats[t.id]||{}).forEach(o=>{if(o.seen){seen++;if(o.lastCorrect)correct++}});
    totSeen+=seen;totCorrect+=correct;
    const cov=Math.round(seen/t.questions.length*100), succ=seen?Math.round(correct/seen*100):0;
    const col=succ>=80?'var(--ok)':succ>=50?'var(--accent)':'var(--ko)';
    return {t,seen,correct,cov,succ,col};
  });
  const globalSucc=totSeen?Math.round(totCorrect/totSeen*100):0;
  const globalCov=Math.round(totSeen/totQ*100);
  const mastered=masteredCount(), errs=errorPool();
  const last=sessions.slice(-8);
  const spark=last.map(s=>{
    const p=s.total?Math.round(s.correct/s.total*100):0;
    const col=p>=80?'var(--ok)':p>=50?'var(--accent)':'var(--ko)';
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px">
      <div style="font-size:10px;color:var(--muted);font-weight:700">${p}%</div>
      <div style="width:70%;height:${Math.max(p,4)}%;background:${col};border-radius:4px 4px 0 0" title="${s.mode==='exam'?'Examen':'Apprentissage'}"></div></div>`;
  }).join('');
  const themeRows=rows.map(r=>`
    <div class="theme-stat"><div class="top"><span>${r.t.icon} ${r.t.name}</span>
      <span class="pct" style="color:${r.seen?r.col:'var(--muted)'}">${r.seen?r.succ+'%':'—'}</span></div>
      <div class="bar"><i style="width:${r.seen?r.succ:0}%;background:${r.col}"></i></div>
      <div class="meta">${r.correct}/${r.seen} réussies · ${r.seen}/${r.t.questions.length} vues (${r.cov}% du thème)</div></div>`).join('');
  const errList = errs.length
    ? `<h2 class="section">Questions à revoir (${errs.length})</h2>
       <div class="footer-bar" style="position:static;margin-top:0"><button class="btn warnb" onclick="openConfig('ERRORS')">&#128260; S'entraîner sur mes erreurs</button></div>
       <div class="revlist">${errs.slice(0,25).map(e=>`<div class="revq">${esc(e.q.q)}<div class="rt">${themeById(e.tid).icon} ${themeById(e.tid).name}</div></div>`).join('')}
       ${errs.length>25?`<div class="hint" style="text-align:center">…et ${errs.length-25} autres</div>`:''}</div>`
    : `<h2 class="section">Questions à revoir</h2><div class="panel"><div class="empty">&#127881; Aucune erreur en attente. Beau travail !</div></div>`;
  app.innerHTML=`
    <div class="stat-row">
      <div class="stat"><div class="v">${globalSucc}%</div><div class="l">Réussite globale</div></div>
      <div class="stat"><div class="v">${globalCov}%</div><div class="l">Programme vu</div></div>
      <div class="stat"><div class="v">${sessions.length}</div><div class="l">Sessions</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="v ok">${mastered}</div><div class="l">Questions maîtrisées</div></div>
      <div class="stat"><div class="v ko">${errs.length}</div><div class="l">À revoir</div></div>
      <div class="stat"><div class="v">${totSeen}/${totQ}</div><div class="l">Questions vues</div></div>
    </div>
    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:12px">&#128200; Évolution (dernières sessions)</h3>
      <div style="display:flex;gap:6px;align-items:flex-end;height:110px;border-bottom:1px solid var(--line);padding-bottom:2px">${spark}</div>
    </div>
    <h2 class="section">Réussite par thème</h2>
    ${themeRows}
    ${errList}
    <div style="text-align:center"><button class="reset" onclick="resetStats()">&#128465; Réinitialiser mes statistiques</button></div>
    <div class="footer-bar" style="position:static"><button class="btn primary" onclick="goHome()">&#127968; Retour à l'accueil</button></div>`;
}
function resetStats(){
  if(confirm("Effacer toutes tes statistiques et ton historique ? Action irréversible.")){
    stats={};sessions=[];saveJSON(LS_STATS,stats);saveJSON(LS_SESS,sessions);
    toast("Statistiques réinitialisées");showAnalyse();
  }
}

/* ============ PWA : installation ============ */
let deferredPrompt=null;
(function setupPWA(){
  const al=document.createElement('link');al.rel='apple-touch-icon';al.href=ICON192;document.head.appendChild(al);
  try{
    const mf={name:"QCM Bloc 3 — Délégué Pharmaceutique",short_name:"QCM Bloc 3",start_url:location.href,scope:"./",
      display:"standalone",background_color:"#f3efe4",theme_color:"#6f8f57",
      icons:[{src:ICON192,sizes:"192x192",type:"image/png",purpose:"any"},
             {src:ICON512,sizes:"512x512",type:"image/png",purpose:"any"},
             {src:ICON512,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    const blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(blob);document.head.appendChild(ml);
  }catch(e){}
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.add('show');});
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.remove('show');deferredPrompt=null;});
function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;document.getElementById('installBtn').classList.remove('show');});}
  else{toast("Sur iPhone : Partager → « Sur l'écran d'accueil »");}
}

/* ============ Démarrage ============ */
goHome();
</script>
